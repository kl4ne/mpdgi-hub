name: Validate MPDGI Hub

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        run: |
          node --check js/app.js
          node --check sw.js

      - name: Validate release integrity
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const read = (file) => fs.readFileSync(file,'utf8');
          const json = (file) => JSON.parse(read(file));
          const exists = (file) => fs.existsSync(file);

          const required = [
            'index.html','sw.js','manifest.json','README.md','.nojekyll',
            'css/style.css','js/app.js',
            'data/config.json','data/links.json','data/changelog.json',
            'assets/profile/logo-mpdg.png',
            'assets/icons/icon-192.png','assets/icons/icon-512.png','assets/icons/apple-touch-icon.png',
            'assets/qr/README.md'
          ];
          for (const file of required) {
            if (!exists(file)) throw new Error('Missing required file: ' + file);
          }

          for (const file of ['manifest.json','data/config.json','data/links.json','data/changelog.json']) {
            json(file);
            console.log(file + ' valid');
          }

          const index = read('index.html');
          const app = read('js/app.js');
          const sw = read('sw.js');
          const manifest = json('manifest.json');
          const config = json('data/config.json');
