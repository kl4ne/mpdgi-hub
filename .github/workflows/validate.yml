name: Validate MPDGI Hub

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate v1.5.2
        run: |
          node --check js/version.js
          node --check js/app.js
          node --check sw.js
          node --check playwright.config.js
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const read=p=>fs.readFileSync(p,'utf8');
          const json=p=>JSON.parse(read(p));

          const brandAssets=[
            'assets/brands/social/facebook.svg',
            'assets/brands/social/instagram.svg',
            'assets/brands/social/youtube.svg',
            'assets/brands/social/tiktok.svg',
            'assets/brands/payments/tithely.svg',
            'assets/brands/payments/square.svg',
            'assets/brands/payments/visa.svg',
            'assets/brands/payments/mastercard.svg',
            'assets/brands/payments/amex.svg',
            'assets/brands/payments/discover.svg',
            'assets/brands/payments/jcb.svg',
            'assets/brands/payments/unionpay.svg',
            'assets/brands/payments/applepay.svg',
            'assets/brands/payments/googlepay.svg',
            'assets/brands/payments/cashapp.svg'
          ];
          const must=[
            'index.html','sw.js','manifest.json','README.md','.nojekyll','CNAME',
            'css/style.css','css/style-v1.5.2.css','js/version.js','js/version-v1.5.2.js','js/app.js','js/app-v1.5.2.js','data/config.json','data/links.json','data/changelog.json',
            'assets/profile/logo-mpdg.png','assets/icons/icon-192.png','assets/icons/icon-512.png','assets/icons/apple-touch-icon.png',
            'assets/social/mpdgi-hub-share.svg','assets/qr/README.md',
            'package.json','playwright.config.js','tests/ui.spec.js','tests/webkit.spec.js',
            '.github/workflows/qa.yml',
            ...brandAssets
          ];
          for(const p of must)if(!fs.existsSync(p))throw Error('Missing: '+p);
          if(fs.existsSync('assets/icons/icon-512.svg'))throw Error('Unused icon-512.svg must remain removed');

          const index=read('index.html'),css=read('css/style.css'),app=read('js/app.js'),sw=read('sw.js');
          const qa=read('.github/workflows/qa.yml');
          const manifest=json('manifest.json'),config=json('data/config.json'),links=json('data/links.json'),changelog=json('data/changelog.json'),pkg=json('package.json');

          delete globalThis.MPDGI_HUB_VERSION;
          require('./js/version.js');
          const release=globalThis.MPDGI_HUB_VERSION;
          if(release!=='1.5.2')throw Error('Runtime version source mismatch');
          if(pkg.version!==release||config.version!==release||changelog[0]?.version!==release)throw Error('Release metadata mismatch');
          if(changelog[0]?.title!=='Session Campaign Attribution')throw Error('Changelog title mismatch');
          if(!app.includes("globalThis.MPDGI_HUB_VERSION||'dev'"))throw Error('App does not consume shared version');
          if(!sw.includes("importScripts('./js/version-v1.5.2.js')")||!sw.includes("self.MPDGI_HUB_VERSION||SCRIPT_VERSION"))throw Error('Service Worker does not consume release-pinned shared version');
          if(!index.includes('<script src="js/version-v1.5.2.js"></script>')||index.indexOf('js/version-v1.5.2.js')>index.indexOf('js/app-v1.5.2.js'))throw Error('Version script ordering mismatch');

          if(app.length>=52000)throw Error('app.js unexpectedly large: '+app.length);
          if(!app.includes('ANALYTICS_SCHEMA_VERSION=1')||!app.includes("VALID_ACQUISITION_SOURCES=new Set(['nfc','qr','link','unattributed'])")||!app.includes("VALID_SESSION_ENTRIES=new Set(['nfc','qr','link','web','pwa'])"))throw Error('Analytics source/session model missing');
          if(!app.includes("ANALYTICS_SESSION_CAMPAIGN_KEY='mpdgiAnalyticsSessionCampaign'")||!app.includes("session_campaign:analyticsState.sessionCampaign||''"))throw Error('Per-session campaign attribution missing');
          if(!app.includes('history.replaceState')||!app.includes('ANALYTICS_SESSION_TIMEOUT=30*60*1000')||!app.includes('navigator.sendBeacon')||!app.includes('ANALYTICS_MAX_QUEUE=100'))throw Error('Analytics reliability controls missing');
          if(!app.includes("analyticsCollector:'https://mpdgi-stats.pages.dev/api/collect'")||!app.includes("location.hostname==='hub.mpdgi.org'"))throw Error('Analytics production guard missing');
          if(!app.includes('mpdgi_visitor_id')||!app.includes('mpdgi_first_source')||!app.includes("display_mode:isStandaloneMode()?'pwa':'browser'"))throw Error('Anonymous acquisition/PWA continuity missing');
          if(app.includes('SOCIAL_BRAND_SVGS'))throw Error('Inline social SVG bundle returned');
          if(!app.includes('SOCIAL_BRAND_ASSETS'))throw Error('Local social brand asset map missing');
          if(!app.includes('PAYMENT_BRAND_SVGS')||app.includes('PAYMENT_BRAND_ASSETS'))throw Error('Known-good inline payment SVG rendering missing');
          for(const p of brandAssets){
            if(fs.statSync(p).size<100)throw Error('Brand asset too small: '+p);
            const rel=p.replace(/^assets\//,'assets/');
            if(p.includes('/social/')){
              if(!app.includes(rel))throw Error('Social brand asset not referenced by app: '+p);
              if(!sw.includes("'./"+p+"'"))throw Error('Social brand asset not precached: '+p);
            }else{
              if(app.includes(rel)||sw.includes("'./"+p+"'"))throw Error('External payment asset still used at runtime: '+p);
            }
          }

          if(css.includes('.modal-action.primary'))throw Error('Dead primary-button CSS returned');
          if(!css.includes('.payment-brand-logo svg')||!css.includes('.social-facebook .brand-mark img'))throw Error('Brand rendering CSS mismatch');
          if(read('css/style-v1.5.2.css')!==css||read('js/app-v1.5.2.js')!==app||read('js/version-v1.5.2.js')!==read('js/version.js'))throw Error('Release-pinned runtime assets drifted from canonical sources');
          if(!index.includes('css/style-v1.5.2.css')||!index.includes('js/app-v1.5.2.js'))throw Error('Release-pinned runtime assets missing from index');
          if(sw.includes('caches.match(')||sw.includes('ignoreSearch'))throw Error('Global/ignoreSearch cache lookup returned');
          if(!sw.includes("cache:'reload'")||!sw.includes('purgeOldCaches')||!sw.includes("type==='REPAIR_CACHES'"))throw Error('Cache reliability/repair strategy missing');
          if(!app.includes("STORAGE_VERSION_KEY='mpdgiHubVersion'")||!app.includes("type:'REPAIR_CACHES'"))throw Error('Stored-version cache repair trigger missing');
          if(!index.includes('id="address-link"')||!app.includes('directionsUrl(address)')||!app.includes("directionsLabel:'Abrir indicaciones"))throw Error('Smart directions behavior missing');
          if(!app.includes('COPYRIGHT_START_YEAR=2026')||!app.includes('__MPDGI_COPYRIGHT_RANGE__')||!app.includes("textElement('p','modal-text',copyrightText(currentLanguage))"))throw Error('Automatic copyright guard missing from footer/About');
          if('organization' in config||'verifiedRoutes' in config)throw Error('Unused config metadata returned');
          if(links.some(x=>'routeVerified' in x))throw Error('Unused routeVerified metadata returned');
          if(sw.includes('data/changelog.json'))throw Error('Changelog must not be runtime-cached');
          if(!sw.includes('dataStaleWhileRevalidate')||!sw.includes('event.waitUntil(network.then'))throw Error('Fast data refresh strategy missing');

          for(const t of ["default-src 'self'","script-src 'self'","style-src 'self'","img-src 'self' data:","connect-src 'self' https://mpdgi-stats.pages.dev","worker-src 'self'","object-src 'none'","base-uri 'self'"])if(!index.includes(t))throw Error('Missing CSP: '+t);
          if(manifest.start_url!=='./'||manifest.scope!=='./'||manifest.id!=='./'||manifest.display!=='standalone'||manifest.lang!=='es'||manifest.dir!=='ltr')throw Error('Manifest mismatch');
          if(manifest.shortcuts)throw Error('Manifest shortcuts must remain disabled');
          if(!manifest.description.startsWith('Hub digital oficial'))throw Error('Manifest description language mismatch');
          for(const icon of manifest.icons||[])if(!fs.existsSync(icon.src))throw Error('Missing manifest icon: '+icon.src);
          if(fs.statSync('assets/profile/logo-mpdg.png').size<5000||fs.statSync('assets/icons/icon-192.png').size<5000)throw Error('Official logo/icon asset too small or missing');

          const urlKeys=['website','memberPortal','prayer','ministries','youtube','facebook','instagram','tiktok','tithely','square','bibleSpanish','bibleEnglish','hubUrl','nfcUrl','customDomain','legacyGitHubPagesUrl'];
          for(const key of urlKeys)if(new URL(config[key]).protocol!=='https:')throw Error('Non-HTTPS: '+key);
          if(config.square!=='https://square.link/u/8veQoUxF')throw Error('Square URL mismatch');
          if(config.tiktok!=='https://www.tiktok.com/@mpdginc')throw Error('TikTok URL mismatch');
          if(config.ministries!=='https://mpdgi.org/ministerios')throw Error('Ministries route mismatch');
          if(config.bibleSpanish!=='https://www.biblegateway.com/versions/Reina-Valera-1960-RVR1960-Biblia/')throw Error('RVR1960 route mismatch');
          if(config.bibleEnglish!=='https://www.biblegateway.com/versions/King-James-Version-KJV-Bible/')throw Error('KJV route mismatch');
          if(config.defaultLanguage!=='es'||config.developer!=='Roberto S. Macfie')throw Error('Config identity/default mismatch');
          if(config.customDomain!=='https://hub.mpdgi.org/'||config.hubUrl!==config.customDomain)throw Error('Production custom-domain mismatch');
          if(config.nfcUrl!=='https://hub.mpdgi.org/?src=nfc'||config.qrUrl!=='https://hub.mpdgi.org/?src=qr'||config.sharedLinkUrl!=='https://hub.mpdgi.org/?src=link')throw Error('Analytics entry URL mismatch');
          if(config.analyticsEnabled!==true||config.analyticsCollector!=='https://mpdgi-stats.pages.dev/api/collect')throw Error('Analytics collector configuration mismatch');
          if(config.legacyGitHubPagesUrl!=='https://kl4ne.github.io/mpdgi-hub/')throw Error('Legacy fallback mismatch');
          if(read('CNAME').trim()!=='hub.mpdgi.org')throw Error('CNAME mismatch');
          if(!index.includes('<link rel="canonical" href="https://hub.mpdgi.org/">'))throw Error('Canonical URL mismatch');

          if(!Array.isArray(links)||links.length!==8)throw Error('Expected exactly 8 cards');
          const ids=new Set(links.map(x=>x.id));
          for(const removed of ['live','events','resources','connect'])if(ids.has(removed))throw Error('Removed card returned: '+removed);
          for(const required of ['members','give','prayer','bible','ministries','social','website','about'])if(!ids.has(required))throw Error('Missing card: '+required);
          const byId=Object.fromEntries(links.map(x=>[x.id,x]));
          if(byId.bible.action!=='modal'||byId.bible.modal!=='bible')throw Error('Bible must use modal');
          if(byId.social.action!=='modal'||byId.social.modal!=='social')throw Error('Social must use modal');
          if(byId.about.action!=='modal'||byId.about.modal!=='about')throw Error('About must use modal');
          if(!byId.social.subtitle.es.includes('TikTok')||!byId.social.subtitle.en.includes('TikTok'))throw Error('TikTok subtitle missing');
          if(!byId.give.subtitle.es.includes('Square')||!byId.give.subtitle.en.includes('Square'))throw Error('Square subtitle missing');

          if(!app.includes("VALID_MODAL_TYPES=new Set(['give','social','bible','about'])"))throw Error('Modal types mismatch');
          if(!app.includes("brandedLink('facebook',s.facebook")||!app.includes("brandedLink('instagram',s.instagram")||!app.includes("brandedLink('youtube',s.youtube")||!app.includes("brandedLink('tiktok',s.tiktok"))throw Error('Social links missing');
          if(!app.includes('PAYMENT_WALLETS')||!app.includes("['applepay','Apple Pay']")||!app.includes("['googlepay','Google Pay']")||!app.includes("['cashapp','Cash App Pay']"))throw Error('Square wallet options missing');
          if(!app.includes('zelleStep1')||!app.includes('zelleStep5'))throw Error('Zelle instructions missing');
          if(!app.includes("skip:'Skip to content'")||!app.includes("visitInfoLabel:'Church information'")||!app.includes("logoAlt:'Official logo of Ministerio Plenitud de Gracia'"))throw Error('Bilingual accessibility labels missing');
          if(!app.includes('setBackgroundInert')||!app.includes('reloadAfterUpdateIfSafe')||!app.includes('createInstallAction'))throw Error('Core modal/PWA behavior missing');

          if(!css.includes('.hub-card.card-about{background:linear-gradient(135deg,#a34357,#612536)}'))throw Error('About theme mismatch');
          if(!css.includes('min-height:100svh')||!css.includes('min-height:100dvh'))throw Error('Dynamic viewport support missing');
          if(!css.includes('@media(max-height:680px)'))throw Error('Short-screen readability rule missing');
          if(!sw.includes('self.skipWaiting()')||!sw.includes('self.clients.claim()'))throw Error('Service Worker immediate activation missing');
          for(const p of ['./index.html','./css/style-v1.5.2.css','./js/version-v1.5.2.js','./js/app-v1.5.2.js','./manifest.json','./data/config.json','./data/links.json','./assets/profile/logo-mpdg.png','./assets/icons/icon-192.png','./assets/icons/icon-512.png','./assets/icons/apple-touch-icon.png'])if(!sw.includes("'"+p+"'"))throw Error('SW missing critical asset: '+p);

          if(pkg.devDependencies?.['@playwright/test']!=='1.63.0')throw Error('Playwright version mismatch');
          const pw=read('playwright.config.js');
          if(!pw.includes("name:'chromium'")||!pw.includes("name:'webkit'"))throw Error('Cross-browser projects missing');
          const tests=read('tests/ui.spec.js');
          if(!tests.includes('cached shell reloads offline in Chromium')||!tests.includes('payment logos remain stable across repeated Chromium reopen cycles')||!tests.includes('stored version mismatch repairs old MPDGI caches')||!tests.includes('copyright year range never goes below')||!tests.includes('About modal renders automatic copyright')||!tests.includes('church address opens directions'))throw Error('v1.5.2 inherited reliability/navigation QA tests missing');
          if(!tests.includes('NFC source is captured')||!tests.includes('first acquisition source stays immutable')||!tests.includes('cookie continuity restores anonymous acquisition')||!tests.includes('switching from browser use to installed-PWA mode')||!tests.includes('without exposing Stats in the public Hub UI'))throw Error('v1.5.2 analytics QA tests missing');
          if(!qa.includes('actions/checkout@v7')||!qa.includes('actions/setup-node@v7')||!qa.includes("node-version: '24'"))throw Error('Modern GitHub Actions runtime missing');
          if(!qa.includes('lighthouse@13.5.0')||!qa.includes('chromium webkit'))throw Error('QA dependency/runtime upgrade missing');
          if(!qa.includes('Production smoke after Pages deployment')||!qa.includes('https://hub.mpdgi.org/'))throw Error('Production smoke check missing');
          if(!qa.includes('Playwright WebKit production smoke')||!qa.includes('BASE_URL: https://hub.mpdgi.org'))throw Error('Production WebKit smoke missing');
          if(!read('tests/webkit.spec.js').includes('WebKit mobile layout'))throw Error('Focused WebKit smoke suite missing');

          const qr=read('assets/qr/README.md');
          if(!qr.includes('https://hub.mpdgi.org/')||!qr.includes('NDEF URI/URL record'))throw Error('NFC documentation mismatch');
          if(index.includes('bottom-nav')||css.includes('.bottom-nav')||css.includes('.nav-item'))throw Error('Bottom navigation returned');
          if(index.includes('id="install-button"'))throw Error('Static install button returned');

          const walk=dir=>fs.readdirSync(dir,{withFileTypes:true}).flatMap(e=>{
            const p=path.join(dir,e.name);
            if(e.name==='.git'||e.name==='node_modules')return[];
            return e.isDirectory()?walk(p):[p];
          });
          const allFiles=walk('.');
          for(const p of allFiles){
            const base=path.basename(p);
            if(base==='.env'||base.startsWith('.env.'))throw Error('Secret env file detected: '+p);
          }
          const textFiles=allFiles.filter(p=>/\.(?:js|json|html|css|md|yml|yaml|txt|xml|svg)$/i.test(p));
          const secretPatterns=[
            /AKIA[0-9A-Z]{16}/,
            /gh[pousr]_[A-Za-z0-9]{36,255}/,
            /AIza[0-9A-Za-z_-]{35}/,
            /sk-[A-Za-z0-9]{20,}/,
            /-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----/,
            /(?:api[_-]?key|client[_-]?secret|access[_-]?token|auth[_-]?token|password)\s*[:=]\s*["'][^"'\n]{12,}["']/i
          ];
          for(const p of textFiles){
            const body=read(p);
            for(const re of secretPatterns)if(re.test(body))throw Error('Potential secret detected in '+p+': '+re);
          }

          console.log('MPDGI Hub v1.5.2 validated');
          NODE
