name: Validate MPDGI Stats

on:
  push:
    branches: [mpdgi-stats-v1.0]
  pull_request:
    paths:
      - 'index.html'
      - 'css/stats.css'
      - 'js/stats*.js'
      - 'functions/**'
      - 'migrations/**'
      - 'manifest.json'
      - 'sw.js'
      - '_headers'
      - 'tests/stats-*'
      - 'playwright.stats.config.cjs'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax and unit validation
        run: |
          node --check js/stats.js
          node --check sw.js
          find functions -name '*.js' -print0 | xargs -0 -n1 node --check
          npm run validate:stats
          node <<'NODE'
          const fs=require('fs');
          const index=fs.readFileSync('index.html','utf8');
          const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const migration=fs.readFileSync('migrations/0001_initial.sql','utf8');
          const migration2=fs.readFileSync('migrations/0002_campaigns.sql','utf8');
          const statsVersion=fs.readFileSync('js/stats-version.js','utf8');
          const headers=fs.readFileSync('_headers','utf8');
          if(!index.includes('Private Analytics Center')||!index.includes('Acceso autorizado solamente'))throw Error('Stats private shell missing');
          if(index.includes('Forgot password'))throw Error('Unsupported email-reset UI must not be advertised');
          if(manifest.name!=='MPDGI Stats • Private Analytics Center'||manifest.display!=='standalone')throw Error('Stats manifest mismatch');
          if(!migration.includes('events')||!migration.includes('event_id TEXT PRIMARY KEY')||!migration.includes('server_day_et'))throw Error('D1 event schema mismatch');
          if(!migration2.includes('CREATE TABLE IF NOT EXISTS campaigns')||!migration2.includes('session_campaign'))throw Error('Campaign migration missing');
          if(!statsVersion.includes("MPDGI_STATS_VERSION='1.4.3'"))throw Error('Stats version mismatch');
          if(!headers.includes('X-Robots-Tag: noindex')||!headers.includes('frame-ancestors \'none\''))throw Error('Stats private/no-index headers missing');
          const collector=fs.readFileSync('functions/api/collect.js','utf8');
          if(!collector.includes('INSERT OR IGNORE INTO events')||collector.includes('CF-Connecting-IP')&&collector.includes('INSERT')&&collector.includes('ip_address'))throw Error('Collector privacy/dedupe invariant failed');
          if(!collector.includes('session_campaign')||!collector.includes('ensureCampaignSchema'))throw Error('Per-session campaign collector support missing');
          const campaignApi=fs.readFileSync('functions/api/campaigns.js','utf8');
          if(!campaignApi.includes("['GET','POST']")||!campaignApi.includes('INSERT INTO campaigns'))throw Error('Saved campaign API missing');
          const reporting=fs.readFileSync('functions/_lib/reporting.js','utf8');
          if(!reporting.includes('COUNT(DISTINCT session_id)')||!reporting.includes("['nfc','qr','link','unattributed']"))throw Error('Reporting definitions drifted');
          if(!reporting.includes('buildActivityInsights')||!reporting.includes('collector_metrics'))throw Error('reporting quality features missing');
          if(reporting.includes("health:{collector:'operational',database:'operational'"))throw Error('System Health must not be hard-coded');
          if(!reporting.includes("SELECT 1 AS ok")||!reporting.includes('database_latency_ms')||!reporting.includes('no_recent_activity')||!reporting.includes('event_pipeline'))throw Error('Real System Health checks missing');
          const schema=fs.readFileSync('functions/_lib/schema.js','utf8');
          if(!schema.includes('CREATE TABLE IF NOT EXISTS collector_metrics'))throw Error('Collector metrics schema missing');
          if(!/CREATE TABLE IF NOT EXISTS collector_metrics\s*\([\s\S]*?last_received_at TEXT\s*\)/.test(schema))throw Error('Collector metrics CREATE TABLE statement is malformed');
          if(!reporting.includes('session_campaign=c.slug')||!reporting.includes('acquired_visitors'))throw Error('Saved campaign reporting missing');
          const statsJs=fs.readFileSync('js/stats.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          if(!statsJs.includes("registration.update()")||!statsJs.includes("'controllerchange'")||!statsJs.includes("'visibilitychange'")||!statsJs.includes("15*60*1000"))throw Error('Silent Stats auto-update checks missing');
          if(!statsJs.includes('mpdgiStatsSwReloadAt')||!statsJs.includes('window.location.reload()'))throw Error('Stats update reload-loop guard missing');
          if(!sw.includes("const VERSION='1.4.3'")||!sw.includes("type==='SKIP_WAITING'"))throw Error('Stats service worker activation/version mismatch');
          if(!index.includes('data-view="cards"')||!index.includes('data-view-panel="cards"')||!index.includes('digital-cards-list'))throw Error('Digital Cards view missing');
          if(!collector.includes('rscard.mpdgi.org')||!collector.includes('npcard.mpdgi.org'))throw Error('Digital card collector origins missing');
          if(collector.includes("[a-z0-9-]+card\\\\.mpdgi\\\\.org"))throw Error('Digital card collector must use explicit origins, not a card-domain regex');
          if(!reporting.includes("target LIKE 'business_card:%'")||!reporting.includes('digital_cards:rows(result[16])'))throw Error('Digital card reporting missing');
          const hubIsolationFilters=(reporting.match(/NOT LIKE 'business_card:%'/g)||[]).length;
          if(hubIsolationFilters<11)throw Error('Hub/Digital Card reporting isolation missing');
          if(!reporting.includes("SELECT DISTINCT s.session_id,s.first_seen_at")||!reporting.includes("e.target NOT LIKE 'business_card:%'"))throw Error('Activity insights must exclude Digital Card sessions');
          if(!statsJs.includes('renderDigitalCards')||!statsJs.includes("navCards:'Tarjetas Digitales'")||!statsJs.includes("navCards:'Digital Cards'"))throw Error('Digital card UI missing');
          if(!statsJs.includes("'nancy-pagan':'Pastora Nancy Pagán'"))throw Error('NPCard display mapping missing');
          if(!index.includes('data-view="methodology"')||!index.includes('data-view-panel="methodology"'))throw Error('Methodology view missing');
          if(!statsJs.includes("navMethodology:'Metodología'")||!statsJs.includes("navMethodology:'Methodology'"))throw Error('Bilingual methodology navigation missing');
          if(!fs.existsSync('ANALYTICS_METHODOLOGY.md')||!fs.existsSync('DATA_RETENTION_POLICY.md'))throw Error('Analytics governance documentation missing');
          console.log('MPDGI Stats static validation passed');
          NODE
      - name: Install Chromium and WebKit
        run: |
          for attempt in 1 2; do
            if timeout 240s npx playwright install --with-deps chromium webkit; then
              exit 0
            fi
            echo "Playwright browser install attempt $attempt failed or timed out; retrying..."
          done
          exit 1
      - name: Start static Stats shell
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/mpdgi-stats-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mpdgi-stats-http.log
          exit 1
      - name: Playwright Chromium and WebKit
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npm run test:stats
