name: Validate MPDGI Stats

on:
  push:
    branches: [mpdgi-stats-v1.0]
  pull_request:
    paths:
      - 'index.html'
      - 'css/stats.css'
      - 'js/stats*.js'
      - 'functions/**'
      - 'migrations/**'
      - 'manifest.json'
      - 'sw.js'
      - '_headers'
      - 'tests/stats-*'
      - 'playwright.stats.config.cjs'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax and unit validation
        run: |
          node --check js/stats.js
          node --check sw.js
          find functions -name '*.js' -print0 | xargs -0 -n1 node --check
          npm run validate:stats
          node <<'NODE'
          const fs=require('fs');
          const index=fs.readFileSync('index.html','utf8');
          const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const migration=fs.readFileSync('migrations/0001_initial.sql','utf8');
          const migration2=fs.readFileSync('migrations/0002_campaigns.sql','utf8');
          const statsVersion=fs.readFileSync('js/stats-version.js','utf8');
          const headers=fs.readFileSync('_headers','utf8');
          if(!index.includes('Private Analytics Center')||!index.includes('Acceso autorizado solamente'))throw Error('Stats private shell missing');
          if(index.includes('Forgot password'))throw Error('Unsupported email-reset UI must not be advertised');
          if(manifest.name!=='MPDGI Stats • Private Analytics Center'||manifest.display!=='standalone')throw Error('Stats manifest mismatch');
          if(!migration.includes('events')||!migration.includes('event_id TEXT PRIMARY KEY')||!migration.includes('server_day_et'))throw Error('D1 event schema mismatch');
          if(!migration2.includes('CREATE TABLE IF NOT EXISTS campaigns')||!migration2.includes('session_campaign'))throw Error('Campaign migration missing');
          if(!statsVersion.includes("MPDGI_STATS_VERSION='1.1.1'"))throw Error('Stats version mismatch');
          if(!headers.includes('X-Robots-Tag: noindex')||!headers.includes('frame-ancestors \'none\''))throw Error('Stats private/no-index headers missing');
          const collector=fs.readFileSync('functions/api/collect.js','utf8');
          if(!collector.includes('INSERT OR IGNORE INTO events')||collector.includes('CF-Connecting-IP')&&collector.includes('INSERT')&&collector.includes('ip_address'))throw Error('Collector privacy/dedupe invariant failed');
          if(!collector.includes('session_campaign')||!collector.includes('ensureCampaignSchema'))throw Error('Per-session campaign collector support missing');
          const campaignApi=fs.readFileSync('functions/api/campaigns.js','utf8');
          if(!campaignApi.includes("['GET','POST']")||!campaignApi.includes('INSERT INTO campaigns'))throw Error('Saved campaign API missing');
          const reporting=fs.readFileSync('functions/_lib/reporting.js','utf8');
          if(!reporting.includes('COUNT(DISTINCT session_id)')||!reporting.includes("['nfc','qr','link','unattributed']"))throw Error('Reporting definitions drifted');
          if(!reporting.includes('session_campaign=c.slug')||!reporting.includes('acquired_visitors'))throw Error('Saved campaign reporting missing');
          console.log('MPDGI Stats static validation passed');
          NODE
      - name: Install Chromium and WebKit
        run: |
          for attempt in 1 2; do
            if timeout 240s npx playwright install --with-deps chromium webkit; then
              exit 0
            fi
            echo "Playwright browser install attempt $attempt failed or timed out; retrying..."
          done
          exit 1
      - name: Start static Stats shell
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/mpdgi-stats-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mpdgi-stats-http.log
          exit 1
      - name: Playwright Chromium and WebKit
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npm run test:stats
