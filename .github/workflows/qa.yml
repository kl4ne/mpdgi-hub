name: QA MPDGI Hub

on:
  push:
    branches: [main, v1.5.0-analytics]
  pull_request:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install QA dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Start local Hub
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/mpdgi-hub-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mpdgi-hub-http.log
          exit 1

      - name: Playwright Chromium functional QA
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npm run test:ui:chromium

      - name: Lighthouse
        run: |
          npx --yes lighthouse@13.5.0 http://127.0.0.1:4173/             --chrome-flags="--headless --no-sandbox --disable-gpu"             --only-categories=performance,accessibility,best-practices             --output=json --output-path=lighthouse.json --quiet
          node <<'NODE'
          const r=require('./lighthouse.json');
          const scores=Object.fromEntries(Object.entries(r.categories).map(([k,v])=>[k,v.score]));
          console.log(scores);
          if(scores.performance < .80) throw Error('Lighthouse performance below 0.80');
          if(scores.accessibility < .90) throw Error('Lighthouse accessibility below 0.90');
          if(scores['best-practices'] < .90) throw Error('Lighthouse best-practices below 0.90');
          NODE

      - name: Production smoke after Pages deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          EXPECTED=$(node -e "require('./js/version.js'); process.stdout.write(globalThis.MPDGI_HUB_VERSION)")
          echo "Expected production version: $EXPECTED"
          for i in {1..20}; do
            HTML=$(curl -fsSL https://hub.mpdgi.org/ 2>/dev/null || true)
            APP=$(curl -fsSL "https://hub.mpdgi.org/js/app-v$EXPECTED.js" 2>/dev/null || true)
            VERSION=$(curl -fsSL "https://hub.mpdgi.org/js/version-v$EXPECTED.js" 2>/dev/null || true)
            CSS=$(curl -fsSL "https://hub.mpdgi.org/css/style-v$EXPECTED.css" 2>/dev/null || true)
            CONFIG=$(curl -fsSL https://hub.mpdgi.org/data/config.json 2>/dev/null || true)
            if grep -q "MPDGI Hub" <<<"$HTML"               && grep -q "MPDGI_HUB_VERSION='$EXPECTED'" <<<"$VERSION"               && grep -q "globalThis.MPDGI_HUB_VERSION" <<<"$APP"               && grep -q "payment-brand-logo" <<<"$CSS"               && grep -q "js/app-v$EXPECTED.js" <<<"$HTML"               && grep -q "css/style-v$EXPECTED.css" <<<"$HTML"               && grep -q "\"version\": \"$EXPECTED\"" <<<"$CONFIG"; then
              FINAL_URL=$(curl -sS -L -o /dev/null -w '%{url_effective}' http://hub.mpdgi.org/)
              [[ "$FINAL_URL" == https://hub.mpdgi.org/* ]] || { echo "HTTP did not redirect to HTTPS: $FINAL_URL"; exit 1; }
              echo "Production smoke passed for v$EXPECTED"
              exit 0
            fi
            echo "Production not ready yet (attempt $i/20); retrying..."
            sleep 15
          done
          echo "Production did not reach expected version $EXPECTED within retry window."
          exit 1

      - name: Playwright WebKit production smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BASE_URL: https://hub.mpdgi.org
        run: npm run test:ui:webkit
