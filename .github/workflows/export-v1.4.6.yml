name: Export MPDGI Hub v1.4.6

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact v1.4.6 source
        uses: actions/checkout@v7
        with:
          ref: 2bb43be9705ae97e0b6ae0e63c21578ba24892cc

      - name: Create complete v1.4.6 archive
        run: |
          zip -r MPDGI-Hub-v1.4.6.zip . -x ".git/*" "MPDGI-Hub-v1.4.6.zip"
          sha256sum MPDGI-Hub-v1.4.6.zip > MPDGI-Hub-v1.4.6.sha256

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: MPDGI-Hub-v1.4.6-backup
          path: |
            MPDGI-Hub-v1.4.6.zip
            MPDGI-Hub-v1.4.6.sha256
          if-no-files-found: error
          retention-days: 30
