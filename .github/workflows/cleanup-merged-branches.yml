name: Cleanup merged Hub branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-merged-branches.yml'
      - '.github/scripts/branch-cleanup.mjs'
  pull_request:
    branches: [main, mpdgi-stats-v1.0]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Clean merged branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLEANUP_HEAD: ${{ github.event.pull_request.head.ref }}
          CLEANUP_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CLEANUP_PR_MERGED: ${{ github.event.pull_request.merged }}
        run: node .github/scripts/branch-cleanup.mjs
