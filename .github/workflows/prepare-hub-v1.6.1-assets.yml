name: Prepare Hub v1.6.1 raster assets

on:
  push:
    branches: [fix/hub-v1.6.1-post-audit]
    paths:
      - '.github/scripts/generate-hub-assets.mjs'

permissions:
  contents: write

jobs:
  prepare-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/hub-v1.6.1-post-audit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node .github/scripts/generate-hub-assets.mjs
      - name: Commit generated assets to repair branch
        run: |
          set -euo pipefail
          git add assets/social/mpdgi-hub-share.png assets/icons/icon-512-maskable.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate high-resolution social preview and safe maskable icon"
          git pull --rebase origin fix/hub-v1.6.1-post-audit
          git push origin HEAD:fix/hub-v1.6.1-post-audit
