name: Production Smoke MPDGI Hub

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read

jobs:
  production-smoke:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify production deployment
        shell: bash
        run: |
          EXPECTED=$(node -e "require('./js/version.js'); process.stdout.write(globalThis.MPDGI_HUB_VERSION)")
          echo "Expected production version: $EXPECTED"
          for i in {1..20}; do
            HTML=$(curl -fsSL https://hub.mpdgi.org/ 2>/dev/null || true)
            APP=$(curl -fsSL https://hub.mpdgi.org/js/app.js 2>/dev/null || true)
            VERSION=$(curl -fsSL https://hub.mpdgi.org/js/version.js 2>/dev/null || true)
            CONFIG=$(curl -fsSL https://hub.mpdgi.org/data/config.json 2>/dev/null || true)
            if grep -q "MPDGI Hub" <<<"$HTML"               && grep -q "MPDGI_HUB_VERSION='$EXPECTED'" <<<"$VERSION"               && grep -q "globalThis.MPDGI_HUB_VERSION" <<<"$APP"               && grep -q "\"version\": \"$EXPECTED\"" <<<"$CONFIG"; then
              FINAL_URL=$(curl -sS -L -o /dev/null -w '%{url_effective}' http://hub.mpdgi.org/)
              [[ "$FINAL_URL" == https://hub.mpdgi.org/* ]] || { echo "HTTP did not redirect to HTTPS: $FINAL_URL"; exit 1; }
              echo "Production smoke passed for v$EXPECTED"
              exit 0
            fi
            echo "Production not ready yet (attempt $i/20); retrying..."
            sleep 15
          done
          echo "Production did not reach expected version $EXPECTED within retry window."
          exit 1
